<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viber UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main">
    <div class="sidebar">
      <div class="title">
        <img src="assets/viber-logo.svg" alt="">
        <h2>Viber</h2>
      </div>

      <div class="search">
        <img src="assets/search.svg" alt="">
        <span>Search</span>
      </div>

      <div class="chat active">
        <div class="person-sign">
          <img src="assets/contacts.svg" alt="">
        </div>

        <div class="chat-text">
          <div class="top">
            <h3>Mern/ Full Stack Web JS...</h3>
            <span>2:21 PM</span>
          </div>
        </div>
      </div>

      <div class="chat">
        <div class="person-sign">
          <img src="assets/contacts.svg" alt="">
        </div>
        <div class="chat-text">
          <div class="top">
            <h3>Friends</h3>
            <span>10:42</span>
          </div>
          <p>Group chat</p>
        </div>
      </div>

      <div class="chat">
        <div class="person-sign">
          <img src="assets/contacts.svg" alt="">
        </div>
        <div class="chat-text">
          <div class="top">
            <h3>Sashank</h3>
            <span>9:18</span>
          </div>
          <p>Are we meeting today?</p>
        </div>
      </div>

      <div class="chat">
        <div class="person-sign">
          <img src="assets/contacts.svg" alt="">
        </div>
        <div class="chat-text">
          <div class="top">
            <h3>Suyog</h3>
            <span>8:55</span>
          </div>
          <p>Sent a message</p>
        </div>
      </div>
    </div>

    <div class="chat-box">
      <div class="header">
        <div>
          <h2>Mern/ Full Stack Web JS...</h2>
          <p>online</p>
        </div>
        <div class="header-icons">
          <img src="assets/voice-call.svg" alt="Voice call">
          <img src="assets/video-call.svg" alt="Video call">
          <img src="assets/settings.svg" alt="More">
        </div>
      </div>

      <div class="messages">
        <div class="msg left"><b>Sashank:</b> Hey everyone</div>
        <div class="msg right"><b>Suyog:</b> I made this viber ui using html and css</div>
        <div class="msg left"><b>Sashank:</b> Looks nice</div>
        <div class="msg right"><b>Suyog:</b> Thanks</div>
      </div>

      <div class="input-box">
        <input type="text" placeholder="Type a message">
        <button><img src="assets/send.svg" alt=""></button>
      </div>
    </div>
  </div>
</body>
</html>
